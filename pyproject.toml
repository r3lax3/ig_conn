[project]
name = "ig-connector"
version = "0.1.0"
description = "Instagram Direct connector to the CRM over the Kafka bus (contract 2.1)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "aiograpi==1.12.14",
    "aiokafka==0.14.0",
    "aiobotocore==3.9.2",
    "asyncpg==0.31.0",
    "pydantic>=2.12.5,<2.14",
    "pydantic-settings==2.15.0",
    "cryptography==50.0.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "aiohttp==3.14.3",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ig_connector"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "C4", "PTH", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["aiograpi.*", "aiobotocore.*", "aiokafka.*", "asyncpg.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: needs a running bus (Kafka, S3, Postgres) configured in .env; run with `-m integration`",
]
